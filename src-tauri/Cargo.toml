[package]
name = "ummka"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "ummka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[features]
native-http-check = []
webview-check = ["objc2-app-kit/NSEvent", "objc2-app-kit/NSGraphicsContext"]

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
mime = "=0.3.18"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "multipart", "stream"] }
reqwest-websocket = "=0.6.0"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "cache"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.7.3"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "=1.29.3", features = ["v4"] }
tokio-util = { version = "=0.7.20", features = ["rt", "io"] }

[target.'cfg(any(target_os = "android", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSProcessInfo", "NSObject", "NSString", "NSURL"] }
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = ["std", "ASFoundation", "ASWebAuthenticationSession", "block2"] }
core-foundation = "=0.10.1"
dirs = "=7.0.0"
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
tauri = { version = "=2.12.7", features = ["test", "unstable"] }
tempfile = "=3.27.0"
