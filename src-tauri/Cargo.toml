[package]
name = "ummka"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "ummka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[features]
native-http-check = []
webview-check = []

[dependencies]
mime = "=0.3.18"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tauri = { version = "=2.12.7", features = [] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
dirs = "=7.0.0"
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
tauri = { version = "=2.12.7", features = ["test", "unstable"] }
tempfile = "=3.27.0"
