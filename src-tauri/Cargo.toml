[package]
name = "ummka"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "ummka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[features]
native-http-check = ["dep:tokio"]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tauri = { version = "=2.12.7", features = [] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.1"
