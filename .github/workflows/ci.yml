name: Native host
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: native-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mattermost:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ["10.10.1", "12.1.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make check-mattermost-${{ matrix.version }}

  macos:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          env-vars: DEVELOPER_DIR
          cache-bin: false
      - run: npm ci
      - run: make check-macos
        env:
          UMMKA_CHECK_MACOS_OFFLINE: "1"
          UMMKA_CHECK_MACOS_BROWSER: "1"
      - name: Open the unpacked app twice offline on the disposable runner
        shell: bash
        run: |
          ditto -x -k artifacts/ummka-macos-arm64.zip "$RUNNER_TEMP/ummka-install"
          registry="$HOME/Library/Application Support/io.github.muxx.ummka.dev/installations.sqlite"
          test ! -e "$registry"
          bash scripts/with-macos-offline.sh bash scripts/smoke-macos.sh "$RUNNER_TEMP/ummka-install/ummka.app"
          test ! -e "$registry"
      - name: Upload dependency report
        if: ${{ !cancelled() && hashFiles('artifacts/trivy.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-report
          path: artifacts/trivy.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ummka-macos-arm64
          path: artifacts/ummka-macos-arm64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [check-android-package, check-android-http]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare the Android test emulator
        if: matrix.task == 'check-android-http'
        run: |
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-36;default;x86_64'
      - name: Install Temurin 17.0.21.1+2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o jdk.tar.gz 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21.1%2B2/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21.1_2.tar.gz'
          echo '0b0ac5eab6db6abaec68c9913bcddb31321e5da411c45073d520d9c125e6f7b4  jdk.tar.gz' | sha256sum -c -
          mkdir ummka-jdk
          tar -xzf jdk.tar.gz --strip-components=1 -C ummka-jdk
          echo "JAVA_HOME=$RUNNER_TEMP/ummka-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ummka-jdk/bin" >> "$GITHUB_PATH"
      - run: rustup target add ${{ matrix.task == 'check-android-http' && 'x86_64-linux-android' || 'aarch64-linux-android' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          env-vars: NDK_HOME
          key: ${{ matrix.task }}
          cache-bin: false
      - run: npm ci
      - name: Cache Android Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/**/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: android-maven-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle', 'src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/**/gradle.lockfile', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-maven-${{ runner.os }}-${{ matrix.task }}-
      - name: Cache verified contract inputs
        if: matrix.task == 'check-android-package'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .check-tools/mattermost-contract
          key: mattermost-contract-${{ hashFiles('scripts/check-contract.sh') }}
      - run: make check-contract
        if: matrix.task == 'check-android-package'
      - run: make ${{ matrix.task }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.task == 'check-android-package'
        with:
          name: ummka-android-arm64
          path: artifacts/ummka-android-arm64-debug.apk
          if-no-files-found: error
